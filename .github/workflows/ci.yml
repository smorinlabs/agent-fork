name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-and-tests:
    name: Matrix, strict collection, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3

      - name: Check matrix coverage and lifecycle
        run: just check-matrix
      - name: Check strict pytest collection
        run: just strict-collect
      - name: Check format, lint, types, and tests
        run: just all
