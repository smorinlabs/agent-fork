name: Clone-cost benchmark

# Fork wall-clock with a 50k-object submodule versus none (A6b step 7). The
# benchmark has no numeric gate and takes ~4 minutes, almost all of it fixture
# build, the measured fork itself, and fixture teardown, so it is not run on
# every pull request: only on PRs that touch the clone/submodule-carry path,
# plus every push to main, nightly, and on demand. Do not make this check
# required — a path-filtered required check stays pending on unrelated PRs.

on:
  pull_request:
    paths:
      - src/agent_fork/submodules.py
      - src/agent_fork/materialize.py
      - src/agent_fork/content.py
      - src/agent_fork/git.py
      - src/agent_fork/include.py
      - src/agent_fork/repository.py
      - src/agent_fork/pipeline.py
      - src/agent_fork/cleanup.py
      - scripts/measure_clone_cost.sh
      - justfile
      - .github/workflows/clone-cost.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-cost:
    name: Submodule clone-cost benchmark
    runs-on: macos-latest
    # Observed runtime is ~4 minutes inside the old combined step.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - uses: extractions/setup-just@v4

      - name: Measure fork cost with and without a large submodule
        run: just measure-clone-cost
